name: Release regression 4.8.1 vs 4.8.0

on:
  push:
  workflow_dispatch:

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare published releases
        shell: bash
        run: >-
          python release-gates/run_gate.py
          --baseline-wheel ctranslate2==4.8.0
          --candidate-wheel ctranslate2==4.8.1
          --tasks whisper_wer opus_bleu t5gemma_generation
          --limit 20 --bleu-limit 500 --device cpu
