# Release gate thresholds.
#
# Each task declares the metrics the harness emits and how a regression
# relative to the baseline (latest PyPI release) is scored.
#
# direction: "lower_is_better" (e.g. WER) or "higher_is_better" (e.g. BLEU, tokens_per_sec).
# max_abs_delta: fail if abs(candidate - baseline) in the wrong direction exceeds this.
# max_rel_delta: fail if relative regression exceeds this fraction (0.10 = 10%).
# severity: "hard" (non-zero exit) or "soft" (warn only).

tasks:
  whisper_wer:
    metrics:
      wer:
        direction: lower_is_better
        max_abs_delta: 0.003   # +0.3 WER points
        severity: hard
      tokens_per_sec:
        direction: higher_is_better
        max_rel_delta: 0.10
        severity: soft

  opus_bleu:
    metrics:
      bleu:
        direction: higher_is_better
        max_abs_delta: 0.3     # -0.3 BLEU points
        severity: hard
      tokens_per_sec:
        direction: higher_is_better
        max_rel_delta: 0.10
        severity: soft
