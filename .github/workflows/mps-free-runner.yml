name: MPS free runner validation

on:
  push:
    branches:
      - test/mps-macos-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-mps:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CT2_VERBOSE: 1
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Apple Silicon and execute a Metal kernel
        run: |
          test "$(uname -m)" = "arm64"
          system_profiler SPHardwareDataType SPDisplaysDataType | tee runner-hardware.txt
          cat > "$RUNNER_TEMP/metal-probe.swift" <<'SWIFT'
          import Foundation
          import Metal

          guard let device = MTLCreateSystemDefaultDevice() else {
              fatalError("No Metal device available on this runner")
          }
          print("Metal device: \(device.name)")
          print("Unified memory: \(device.hasUnifiedMemory)")
          print("Recommended working set: \(device.recommendedMaxWorkingSetSize) bytes")
          let source = """
          #include <metal_stdlib>
          using namespace metal;
          kernel void increment(device uint *values [[buffer(0)]],
                                uint index [[thread_position_in_grid]]) {
              values[index] += 1;
          }
          """
          let library = try device.makeLibrary(source: source, options: nil)
          guard let function = library.makeFunction(name: "increment"),
                let queue = device.makeCommandQueue(),
                let buffer = device.makeBuffer(length: 4 * MemoryLayout<UInt32>.stride,
                                               options: .storageModeShared),
                let commandBuffer = queue.makeCommandBuffer(),
                let encoder = commandBuffer.makeComputeCommandEncoder() else {
              fatalError("Could not create Metal compute resources")
          }
          let pipeline = try device.makeComputePipelineState(function: function)
          let values = buffer.contents().bindMemory(to: UInt32.self, capacity: 4)
          for index in 0..<4 { values[index] = UInt32(index) }
          encoder.setComputePipelineState(pipeline)
          encoder.setBuffer(buffer, offset: 0, index: 0)
          encoder.dispatchThreads(MTLSize(width: 4, height: 1, depth: 1),
                                  threadsPerThreadgroup: MTLSize(width: 4, height: 1, depth: 1))
          encoder.endEncoding()
          commandBuffer.commit()
          commandBuffer.waitUntilCompleted()
          guard commandBuffer.status == .completed else {
              fatalError("Metal command failed: \(String(describing: commandBuffer.error))")
          }
          for index in 0..<4 {
              precondition(values[index] == UInt32(index + 1), "Incorrect Metal kernel result")
          }
          print("Metal compute probe passed")
          SWIFT
          swift "$RUNNER_TEMP/metal-probe.swift" | tee metal-probe.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure MPS build
        run: |
          cmake -S . -B build-mps \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-mps" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTS=ON \
            -DWITH_MPS=ON \
            -DWITH_ACCELERATE=ON \
            -DWITH_MKL=OFF \
            -DWITH_RUY=ON \
            -DOPENMP_RUNTIME=NONE

      - name: Build and install MPS library
        run: |
          cmake --build build-mps --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install build-mps

      - name: Download test data
        id: test_data
        working-directory: tests/data/models
        run: |
          curl --fail --location --output transliteration-aren-all.tar.gz \
            https://opennmt-models.s3.amazonaws.com/transliteration-aren-all.tar.gz
          tar xf transliteration-aren-all.tar.gz

      - name: Run MPS runtime test suite
        run: |
          build-mps/tests/ctranslate2_test tests/data \
            --gtest_filter='MPSBackendTest.*:MPSPrimitiveTest.*:TranslatorTest.MPS*:MPS/*' \
            --gtest_output=xml:mps-results.xml

      - name: Run CPU and shared test suite from MPS build
        if: ${{ !cancelled() && steps.test_data.outcome == 'success' }}
        run: |
          build-mps/tests/ctranslate2_test tests/data \
            --gtest_filter='-MPSBackendTest.*:MPSPrimitiveTest.*:TranslatorTest.MPS*:MPS/*' \
            --gtest_output=xml:cpu-results.xml

      - name: Build MPS Python bindings
        id: build_python
        if: ${{ !cancelled() && steps.test_data.outcome == 'success' }}
        env:
          CTRANSLATE2_ROOT: ${{ github.workspace }}/install-mps
        run: |
          python -m pip install -r python/install_requirements.txt pytest
          python -m pip install ./python

      - name: Test Python CPU selection and explicit MPS inference
        if: ${{ !cancelled() && steps.build_python.outcome == 'success' }}
        env:
          CT2_TEST_MPS: 1
        run: |
          python -m pytest --import-mode=importlib -v python/tests/test_mps.py \
            --junitxml=python-mps-results.xml

      - name: Upload hardware details and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-macos-15-results
          retention-days: 7
          path: |
            runner-hardware.txt
            metal-probe.txt
            mps-results.xml
            cpu-results.xml
            python-mps-results.xml
