name: Validate Windows CUDA toolkit path
on:
  push:
    branches: [validate-cuda-toolkit-path]
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install same CUDA components as PR
        shell: bash
        run: |
          curl --fail -L -o cuda.exe https://developer.download.nvidia.com/compute/cuda/12.8.1/local_installers/cuda_12.8.1_572.61_windows.exe
          ./cuda.exe -s nvcc_12.8 cudart_12.8 cublas_dev_12.8 curand_dev_12.8 visual_studio_integration_12.8
      - name: Reproduce failure and validate explicit toolkit path
        shell: bash
        run: |
          set -euxo pipefail
          CUDA_ROOT="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          cmake --version
          "$CUDA_ROOT/bin/nvcc.exe" --version
          mkdir cuda-smoke
          cat > cuda-smoke/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.24)
          project(cuda_smoke LANGUAGES CXX)
          set(CMAKE_CUDA_HOST_COMPILER "${CMAKE_CXX_COMPILER}")
          set(CMAKE_CUDA_STANDARD 17)
          enable_language(CUDA)
          find_package(CUDAToolkit 11.0 REQUIRED)
          add_library(smoke STATIC smoke.cu)
          CMAKE
          cat > cuda-smoke/smoke.cu <<'CUDA'
          #include <cuda_runtime.h>
          __global__ void smoke_kernel(float* data) { data[threadIdx.x] = 1.0f; }
          void smoke(float* data) { smoke_kernel<<<1, 32>>>(data); }
          CUDA
          if cmake -S cuda-smoke -B baseline -DCUDA_TOOLKIT_ROOT_DIR="$CUDA_ROOT" -DCMAKE_CUDA_ARCHITECTURES=75 > baseline.log 2>&1; then
            cat baseline.log
            echo 'Baseline unexpectedly passed; failure was not reproduced.'
            exit 1
          fi
          cat baseline.log
          grep -F "directory '' does not" baseline.log
          cmake -S cuda-smoke -B fixed -T "cuda=$CUDA_ROOT" -DCMAKE_CUDA_ARCHITECTURES=75
          cmake --build fixed --config Release --parallel 2 --verbose
          grep -F CudaToolkitCustomDir fixed/CMakeFiles/*/CompilerIdCUDA/CompilerIdCUDA.vcxproj
          grep -F CudaToolkitCustomDir fixed/smoke.vcxproj
      - name: Configure and build CTranslate2 with explicit toolkit path
        shell: bash
        run: |
          set -euxo pipefail
          CUDA_ROOT="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          cmake -S . -B ct2-validation -T "cuda=$CUDA_ROOT" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DWITH_MKL=OFF -DWITH_DNNL=OFF -DOPENMP_RUNTIME=COMP -DBUILD_CLI=OFF -DWITH_CUDA=ON -DWITH_CUDNN=OFF -DCUDA_DYNAMIC_LOADING=ON -DCMAKE_CUDA_FLAGS="-Xfatbin=-compress-all" -DCMAKE_CUDA_ARCHITECTURES=75 -DWITH_FLASH_ATTN=OFF
          cmake --build ct2-validation --config Release --parallel 2
